# SPDX-License-Identifier: MIT
serial --unit=0 --speed=115200
terminal_input --append serial
terminal_output --append serial

set default=0
set timeout=5

# Debian's kernel install hooks maintain these symlinks on the ext4 root.
set root_uuid=1f55d66a-40d8-11ee-be56-0242ac120002
search --no-floppy --fs-uuid --set=root $root_uuid

menuentry 'CIP-Core Xfce' {
    linux /vmlinuz root=UUID=$root_uuid ro rootwait console=ttyS0,115200 console=tty0
    initrd /initrd.img
}

menuentry 'CIP-Core Xfce - text console' {
    linux /vmlinuz root=UUID=$root_uuid ro rootwait console=ttyS0,115200 console=tty0 systemd.unit=multi-user.target
    initrd /initrd.img
}

menuentry 'Memory test (Memtest86+)' {
    chainloader /boot/memtest86+x64.efi
}

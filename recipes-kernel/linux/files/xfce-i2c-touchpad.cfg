# Tiger Lake Serial IO and GPIO interrupt support for the ELAN I2C-HID touchpad.
CONFIG_MFD_INTEL_LPSS_PCI=m
CONFIG_PINCTRL_TIGERLAKE=m
CONFIG_I2C_HID_ACPI=m
CONFIG_HID_MULTITOUCH=m

# Native ELAN touchpads on I2C or SMBus.
CONFIG_MOUSE_ELAN_I2C=m
CONFIG_MOUSE_ELAN_I2C_I2C=y
CONFIG_MOUSE_ELAN_I2C_SMBUS=y

# Synaptics RMI4 touchpads over HID and SMBus.
CONFIG_RMI4_CORE=m
CONFIG_RMI4_SMB=m
CONFIG_HID_RMI=m

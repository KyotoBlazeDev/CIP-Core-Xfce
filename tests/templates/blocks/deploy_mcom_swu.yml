# DEPLOY BLOCK (.swu to downloads, before the flasher deploy)
# swupdate -d does not work on M-COM, so the .swu file is deployed to downloads
- deploy:
    timeout:
      minutes: 60
    to: downloads
    images:
      image:
        url: ${project_url}/${branch}/x86-uefi/cip-core-image-security-cip-core-${distribution}-x86-uefi.swu

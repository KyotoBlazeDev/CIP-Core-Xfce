# qemu-swtpm.sock will be gone after soft reboot.
# So the swtpm socket need to be started again for proper reboot
# To start the swtpm daemon, first the existing one should be killed
- command:
    name: manual_kill
    timeout:
          minutes: 1
# Start the swtpm daemon
- command:
    name: start_tpm
    timeout:
          minutes: 1

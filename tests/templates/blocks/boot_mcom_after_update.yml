# BOOT BLOCK (after update, no overlay transfer)
- boot:
    method: minimal
    timeout:
      minutes: 45
    reset: true
    failure_retry: 1
    prompts: ["root@demo:~#"]
    auto_login:
      login_prompt: "demo login:"
      username: "root"
      password_prompt: "Password:"
      password: "CIPsecurity@123"
      login_commands:
        - if mountpoint /home; then mount -o remount,exec /home; else mount -o remount,exec /var; fi
